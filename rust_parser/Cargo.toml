[package]
name = "rust_parser"
version = "0.1.0"
edition = "2021"
description = "High-performance document parser for Local RAG AI Assistant"

[lib]
name = "rust_parser"
crate-type = ["cdylib"]

[dependencies]
# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }

# ZIP archives (DOCX, PPTX, EPUB are ZIP-based)
zip = { version = "7", default-features = false, features = ["deflate"] }

# XML parsing (DOCX/PPTX internals)
quick-xml = { version = "0.36", features = ["serialize"] }

# HTML parsing
scraper = "0.21"

# Excel parsing
calamine = "0.26"

# CSV parsing
csv = "1.3"

# JSON
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# Unicode normalization
unicode-normalization = "0.1"

# Parallel processing
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
