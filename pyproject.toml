[project]
name = "local-rag-ai-assistant"
version = "0.1.0"
description = "Local RAG AI Assistant with Microsoft Foundry Local"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "foundry-local-sdk>=1.2.3",
    "streamlit>=1.22.0",
    "pytest>=7.0.0",
    "numpy>=1.24.0",
    "pymupdf>=1.24.0",
    "qdrant-client>=1.9.0",
    # Python fallback parser'lar (Rust parser yoksa kullanilir)
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "openpyxl>=3.1.0",
    "ebooklib>=0.18",
    # Observability (OpenTelemetry & Prometheus)
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "prometheus-client>=0.20.0",
    "requests>=2.30.0",
    # Encrypted Document Vault (AES-256-GCM)
    "cryptography>=42.0.0",
]
