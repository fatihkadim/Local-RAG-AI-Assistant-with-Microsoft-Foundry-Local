services:
  # 1. Qdrant Vektör Veritabanı
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_local
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # 2. Prometheus Metrik Toplama & Görselleştirme (Opsiyonel)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_local
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 3. Jaeger Distributed Tracing UI (Opsiyonel)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger_local
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC Receiver
      - "4318:4318"   # OTLP HTTP Receiver
    restart: unless-stopped
